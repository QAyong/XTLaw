name: XTLaw Release
run-name: Publish XTLaw v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已提交到 master 且尚未发布的 XTLaw 版本（首次为 0.1.0）
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: xtlaw-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    if: github.repository == 'QAyong/XTLaw' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.transition.outputs.commit }}
      tag: ${{ steps.transition.outputs.tag }}
      version: ${{ steps.transition.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test release source validation
        run: node --test packaging/release/tests/publication.test.mjs

      - name: Validate release source
        id: transition
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node packaging/release/publication.mjs --github-output "$GITHUB_OUTPUT"

      - name: Require unused release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.transition.outputs.tag }}
        run: |
          require_missing() {
            local label="$1"
            local endpoint="$2"
            local lookup_error="$RUNNER_TEMP/lexora-$label-lookup.error"
            if gh api "$endpoint" >/dev/null 2>"$lookup_error"; then
              echo "Release $label already exists for $TAG" >&2
              exit 1
            fi
            if ! grep -q 'HTTP 404' "$lookup_error"; then
              cat "$lookup_error" >&2
              exit 1
            fi
          }

          require_missing tag "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          require_missing release "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"

  packages:
    name: Package verification
    needs: validate-release
    uses: ./.github/workflows/buddy-build.yml
    with:
      upload-artifacts: true

  macos:
    name: macOS package verification
    needs: validate-release
    uses: ./.github/workflows/macos-verify.yml
    with:
      signing: ad-hoc

  publish-release:
    name: Publish Release
    needs: [validate-release, packages, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: xtlaw-release
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified Ubuntu package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-ubuntu
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Ubuntu ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-ubuntu-arm64
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Arch package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-arch
          path: apps/buddy/.output/artifacts/arch

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-windows
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified Windows ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-windows-arm64
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified macOS ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-macos-arm64
          path: apps/buddy/.output/artifacts/macos

      - name: Reconstruct release metadata and checksums
        run: |
          node packaging/buddy/release/verify-release-artifacts.mjs --github-env "$GITHUB_ENV"

      - name: Bind artifacts to validated transition
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
          EXPECTED_TAG: ${{ needs.validate-release.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          if [[ "$LEXORA_BUDDY_RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Artifact tag does not match validated release transition" >&2
            exit 1
          fi
          if [[ "$LEXORA_BUDDY_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Artifact version does not match validated release transition" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]]; then
            echo "Publication checkout does not match validated release commit" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/apps/buddy/.output/artifacts/desktop/*.deb
            ${{ github.workspace }}/apps/buddy/.output/artifacts/arch/*.pkg.tar.zst
            ${{ github.workspace }}/apps/buddy/.output/artifacts/windows/*.exe
            ${{ github.workspace }}/apps/buddy/.output/artifacts/macos/*.dmg
            ${{ github.workspace }}/apps/buddy/.output/artifacts/SHA256SUMS.txt

      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          lookup_error="$RUNNER_TEMP/lexora-tag-create.error"
          if existing_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha' 2>"$lookup_error"
          )"; then
            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Release tag $RELEASE_TAG already references another object" >&2
              exit 1
            fi
            echo "Release tag $RELEASE_TAG already references the validated commit"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_COMMIT"

      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$LEXORA_BUDDY_RELEASE_TAG" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO" \
            --verify-tag \
            --title "XTLaw $LEXORA_BUDDY_VERSION" \
            --generate-notes \
            --draft

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$LEXORA_BUDDY_RELEASE_TAG" \
            "$LEXORA_BUDDY_DEB_PATH#$LEXORA_BUDDY_DEB_ASSET_NAME" \
            "$LEXORA_BUDDY_DEB_ARM64_PATH#$LEXORA_BUDDY_DEB_ARM64_ASSET_NAME" \
            "$LEXORA_BUDDY_ARCH_PATH#$LEXORA_BUDDY_ARCH_ASSET_NAME" \
            "$LEXORA_BUDDY_WINDOWS_PATH#$LEXORA_BUDDY_WINDOWS_ASSET_NAME" \
            "$LEXORA_BUDDY_WINDOWS_ARM64_PATH#$LEXORA_BUDDY_WINDOWS_ARM64_ASSET_NAME" \
            "$LEXORA_BUDDY_MACOS_ARM64_PATH#$LEXORA_BUDDY_MACOS_ARM64_ASSET_NAME" \
            "$LEXORA_BUDDY_CHECKSUM_PATH#$LEXORA_BUDDY_CHECKSUM_ASSET_NAME" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$LEXORA_BUDDY_RELEASE_TAG" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO" \
            --draft=false

  verify-public-assets:
    name: Verify public assets
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified Ubuntu package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-ubuntu
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Ubuntu ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-ubuntu-arm64
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Arch package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-arch
          path: apps/buddy/.output/artifacts/arch

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-windows
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified Windows ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-windows-arm64
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified macOS ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtlaw-macos-arm64
          path: apps/buddy/.output/artifacts/macos

      - name: Reconstruct expected public asset metadata
        run: |
          node packaging/buddy/release/verify-release-artifacts.mjs --github-env "$GITHUB_ENV"

      - name: Verify artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$LEXORA_BUDDY_DEB_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_DEB_ARM64_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_ARCH_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_WINDOWS_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_WINDOWS_ARM64_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_MACOS_ARM64_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$LEXORA_BUDDY_CHECKSUM_PATH" --repo "$GITHUB_REPOSITORY"

      - name: Verify public packages and checksums
        run: node packaging/buddy/release/verify-release-artifacts.mjs --verify-public
