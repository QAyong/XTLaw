name: XTLaw 0.5.5 Scheduled Build
run-name: Build XTLaw 0.5.5 without publishing

on:
  schedule:
    # 2026-11-10 06:00 Asia/Shanghai = 2026-11-09 22:00 UTC.
    # Cron has no year field; the guard below prevents future-year builds.
    - cron: '0 22 9 11 *'

permissions:
  contents: read

concurrency:
  group: xtlaw-scheduled-055-build
  cancel-in-progress: false

jobs:
  guard:
    name: Check one-time build date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.date.outputs.build }}
    steps:
      - name: Allow only the requested occurrence
        id: date
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$REPOSITORY" == 'QAyong/XTLaw' && "$(date -u +%F)" == '2026-11-09' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Build and verify Windows and Linux
    needs: guard
    if: needs.guard.outputs.build == 'true'
    uses: ./.github/workflows/buddy-build.yml
    with:
      platform: all
      upload-artifacts: true

  macos:
    name: Build and verify macOS
    needs: guard
    if: needs.guard.outputs.build == 'true'
    uses: ./.github/workflows/macos-verify.yml
    with:
      signing: ad-hoc
